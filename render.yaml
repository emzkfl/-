services:
  - type: web
    runtime: python
    name: maple-live-scout
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/server.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: NEXON_API_KEY
        sync: false
